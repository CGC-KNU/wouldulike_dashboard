# Probe 슬랙 공지 올리기 — 민찬이 정한 글을 Probe 이름으로 채널에 올린다 (1011, 「Probe 소개글」).
#
# 정기 알림이 아니라 **손으로 한 번** 올리는 글(소개·공지)용이다. 토큰이 이 저장소 Secrets 에만 있어서 워크플로로 올린다.
# Probe 가 쓰는 두 채널(#sat-probe · #ops-partner)만 받는다. 글은 슬랙 mrkdwn 으로 해석된다.
#
# 손으로 돌릴 때는 dry_run 이 기본이다 — 채널과 글자 수만 보여 주고 올리지 않는다.
# **이 저장소는 공개다.** 로그에는 채널·글자 수만 찍는다. 다만 workflow_dispatch 입력값은 실행 정보 화면에 그대로 보이니
# 내부 숫자·매장 이름 같은 건 이 입력으로 올리지 않는다(소개·공지 문구용).
name: Probe 슬랙 공지 올리기

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "올릴 채널"
        type: choice
        options: ["sat-probe", "ops-partner"]
        default: "sat-probe"
      text:
        description: "올릴 글 (슬랙 mrkdwn)"
        required: true
      dry_run:
        description: "올리지 않고 채널·글자 수만 본다"
        type: boolean
        default: true

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 올리기
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_PROBE_BOT_TOKEN }}
          # 입력은 env 로만 넘긴다 — run 에 직접 끼우면 글에 섞인 글자가 셸 명령이 된다
          CHANNEL_NAME: ${{ inputs.channel }}
          TEXT: ${{ inputs.text }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          case "$CHANNEL_NAME" in
            sat-probe) CH=C0BPKGXDTPF ;;
            ops-partner) CH=C0BPSQ7F8LC ;;
            *) echo "::error::Probe 채널(sat-probe · ops-partner)만 받습니다"; exit 1 ;;
          esac
          [ -n "${TEXT//[[:space:]]/}" ] || { echo "::error::올릴 글이 비어 있습니다"; exit 1; }
          echo "#$CHANNEL_NAME · ${#TEXT}자"
          if [ "$DRY" = "true" ]; then echo "dry_run — 올리지 않고 끝냅니다"; exit 0; fi
          [ -n "$SLACK_TOKEN" ] || { echo "::error::SLACK_PROBE_BOT_TOKEN 이 없습니다"; exit 1; }
          R=$(curl -sS --max-time 30 -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
            -d "$(jq -n --arg c "$CH" --arg t "$TEXT" '{channel: $c, text: $t, unfurl_links: false}')")
          if [ "$(jq -r .ok <<<"$R")" = "true" ]; then echo "올렸습니다"; else echo "::error::올리지 못했습니다: $(jq -r .error <<<"$R")"; exit 1; fi
