# PROBE 앱 지표 보고서 — #sat-probe 에 HTML 파일과 숫자 세 줄(사용자 · 쿠폰 사용 · 스탬프 적립)을 올린다 (민찬 0927~0928).
#
#   주간  월요일 12:00 KST 에 깨어나 **일요일 GA4 데이터가 들어올 때까지** 15분마다 확인하고, 들어오면 한 번 보낸다.
#         17:30 KST 까지 안 들어오면 사용자 줄만 「집계 중」으로 두고 보낸다(Actions 는 작업 하나에 6시간까지다).
#         0927 실측: 최근 6번의 일요일 중 4번은 정오 전에 들어왔고, 9/13분은 12:02 · 8/16분은 15:52 였다.
#   월간  매월 2일 12:00 KST — 지난달 월별 스냅샷이 1일 02:10 에 굳고, 말일 GA4 도 대개 1일 낮에 들어온다.
#
# 보고서는 대시보드 /api/probe/app-report/cron 이 만든다(스크립트 없는 HTML · 메시지 본문). 토큰 판정은 백엔드가 한다.
# 주를 **반드시 적어서** 부른다 — 비워 두면 대시보드가 "GA4 마지막 테이블 기준 마지막 주"를 골라, 일요일분이
# 아직 없을 때 지난주 보고서를 한 번 더 보낸다.
#
# 필요한 것 (Settings → Secrets and variables → Actions):
#   CRON_SECRET_TOKEN      백엔드 Koyeb 의 CRON_SECRET_TOKEN 과 같은 값
#   SLACK_PROBE_BOT_TOKEN  PROBE 앱 봇 토큰(xoxb-, chat:write · files:write). #sat-probe 에 초대돼 있어야 한다
#
# 손으로 돌릴 때는 dry_run 이 기본이다 — 만들기까지만 하고 슬랙에는 안 올린다.
# 이 저장소는 공개라 로그를 누구나 본다 — 숫자·본문은 찍지 않고 줄 수·크기만 남긴다(0928).
name: PROBE 앱 지표 보고서

on:
  schedule:
    - cron: "0 3 * * 1"   # 월 12:00 KST — 주간
    - cron: "0 3 2 * *"   # 매월 2일 12:00 KST — 월간
  workflow_dispatch:
    inputs:
      type:
        description: "weekly 또는 monthly"
        type: choice
        options: [weekly, monthly]
        default: weekly
      week:
        description: "주간: 그 주의 아무 날 (YYYY-MM-DD). 비우면 지난주"
        required: false
      month:
        description: "월간: YYYY-MM. 비우면 지난달"
        required: false
      wait:
        description: "GA4 데이터가 올 때까지 기다린다(정기 실행과 같게)"
        type: boolean
        default: false
      dry_run:
        description: "슬랙에 올리지 않는다(로그에는 줄 수·크기만 — 저장소가 공개)"
        type: boolean
        default: true

concurrency:
  group: probe-app-report-${{ github.event.schedule || inputs.type }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: 보고서 만들어 올리기
        env:
          BASE: https://app.wouldulike.kr
          CHANNEL: C0BPKGXDTPF   # #sat-probe
          CRON_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
          SLACK_TOKEN: ${{ secrets.SLACK_PROBE_BOT_TOKEN }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_TYPE: ${{ inputs.type }}
          IN_WEEK: ${{ inputs.week }}
          IN_MONTH: ${{ inputs.month }}
          IN_WAIT: ${{ inputs.wait }}
          IN_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          [ -n "$CRON_TOKEN" ] || { echo "::error::CRON_SECRET_TOKEN 이 없습니다"; exit 1; }

          if [ "$EVENT" = "schedule" ]; then
            if [ "$SCHEDULE" = "0 3 2 * *" ]; then TYPE=monthly; else TYPE=weekly; fi
            WAIT=true; DRY=false; IN_WEEK=""; IN_MONTH=""
          else
            TYPE="$IN_TYPE"; WAIT="$IN_WAIT"; DRY="$IN_DRY"
          fi
          if [ "$TYPE" = "monthly" ]; then
            MONTH="${IN_MONTH:-$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%Y-%m-01) -1 day" +%Y-%m)}"
            Q="type=monthly&month=$MONTH"
          else
            # 월요일이면 어제(일요일), 일요일이면 지난 일요일 — 늘 다 끝난 주
            WEEK="${IN_WEEK:-$(TZ=Asia/Seoul date -d 'last sunday' +%F)}"
            Q="week=$WEEK"
          fi
          echo "보고서: $TYPE ($Q) · 기다림=$WAIT · 올리지 않음=$DRY"

          # 상태 코드만 돌려준다. 네트워크 오류면 000 — set -e 로 멈추지 않게 실패를 삼킨다
          call() { local c; c=$(curl -sS --max-time 90 -H "X-CRON-TOKEN: $CRON_TOKEN" -o "$2" -w '%{http_code}' "$BASE/api/probe/app-report/cron?$1") || true; echo "${c:-000}"; }

          # ── GA4 기다리기 — 보고서를 매번 만들지 않고 테이블 목록만 본다(check=1)
          if [ "$WAIT" = "true" ]; then
            DEADLINE=$(TZ=Asia/Seoul date -d "today 17:30" +%s)
            while :; do
              CODE=$(call "check=1&$Q" check.json)
              if [ "$CODE" = "200" ] && [ "$(jq -r .ready check.json)" = "true" ]; then
                echo "GA4 준비됨 — $(jq -r .through check.json) 까지"; break
              fi
              # 토큰·요청이 틀렸으면 기다려도 안 풀린다 — 바로 실패로 남긴다
              case "$CODE" in 4*) echo "::error::확인 요청이 거절됐습니다 HTTP $CODE — $(head -c 300 check.json)"; exit 1;; esac
              echo "$(TZ=Asia/Seoul date +%H:%M) GA4 아직 — HTTP $CODE $(head -c 200 check.json 2>/dev/null || true)"
              if [ "$(date +%s)" -ge "$DEADLINE" ]; then
                echo "::warning::17:30 까지 GA4 가 안 들어왔습니다 — 사용자 줄을 「집계 중」으로 보냅니다"; break
              fi
              sleep 900
            done
          fi

          # ── 보고서 받기 (백엔드·BigQuery 가 잠깐 흔들리면 두 번 더)
          for i in 1 2 3; do
            CODE=$(call "$Q" report.json)
            [ "$CODE" = "200" ] && break
            echo "보고서 HTTP $CODE — $(head -c 300 report.json 2>/dev/null || true)"
            case "$CODE" in 4*) exit 1;; esac
            sleep 30
          done
          [ "$CODE" = "200" ] || { echo "::error::보고서를 받지 못했습니다"; exit 1; }

          # 이 저장소는 공개라 Actions 로그를 누구나 본다 — 숫자·본문은 찍지 않는다(0928). 경고는 무엇을 못 읽었는지뿐이다.
          jq -r '.warnings[]' report.json | sed 's/^/경고: /' || true
          STATUS=$(jq -r .status report.json)
          [ "$STATUS" = "ok" ] || { echo "::error::양식 검사에서 빠진 값이 나왔습니다(status=$STATUS) — 보내지 않습니다"; exit 1; }
          # 양식 검사는 구조만 본다 — 숫자가 전부 비어도 ok 라서 따로 막는다
          [ "$(jq '[.summary[].value | select(. != null)] | length' report.json)" -gt 0 ] \
            || { echo "::error::숫자 세 개가 모두 비었습니다 — 보내지 않습니다"; exit 1; }

          FILE=$(jq -r .filename report.json)
          jq -r .html report.json > "$FILE"
          MESSAGE=$(jq -r .message report.json)
          echo "본문 $(printf '%s\n' "$MESSAGE" | wc -l)줄 · 파일 $(wc -c < "$FILE") bytes · GA4 준비=$(jq -r .ready report.json)"

          if [ "$DRY" = "true" ]; then echo "dry_run — 슬랙에 올리지 않고 끝냅니다"; exit 0; fi
          [ -n "$SLACK_TOKEN" ] || { echo "::error::SLACK_PROBE_BOT_TOKEN 이 없습니다"; exit 1; }

          # ── 슬랙 파일 업로드 3단계 (bannerlab/services/slack.py 와 같은 순서)
          R1=$(curl -sS -X POST https://slack.com/api/files.getUploadURLExternal \
            -H "Authorization: Bearer $SLACK_TOKEN" --data-urlencode "filename=$FILE" --data "length=$(wc -c < "$FILE")")
          [ "$(jq -r .ok <<<"$R1")" = "true" ] || { echo "::error::업로드 주소 발급 실패: $(jq -r .error <<<"$R1")"; exit 1; }
          UP=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$(jq -r .upload_url <<<"$R1")" -F "file=@$FILE")
          [ "$UP" = "200" ] || { echo "::error::파일 올리기 실패 HTTP $UP"; exit 1; }
          R3=$(curl -sS -X POST https://slack.com/api/files.completeUploadExternal \
            -H "Authorization: Bearer $SLACK_TOKEN" -H "Content-Type: application/json; charset=utf-8" \
            --data "$(jq -n --arg id "$(jq -r .file_id <<<"$R1")" --arg t "$FILE" --arg c "$CHANNEL" --arg m "$MESSAGE" \
              '{files:[{id:$id,title:$t}],channel_id:$c,initial_comment:$m}')")
          [ "$(jq -r .ok <<<"$R3")" = "true" ] \
            || { echo "::error::슬랙 게시 실패: $(jq -r .error <<<"$R3") — PROBE 가 #sat-probe 에 초대돼 있는지 보세요"; exit 1; }
          echo "#sat-probe 에 올렸습니다"
