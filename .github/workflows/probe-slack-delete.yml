# Probe 슬랙 메시지 지우기 — Probe 봇이 올린 메시지를 링크로 지운다 (민찬 1010).
#
# 봇은 **자기가 쓴 메시지만** 지울 수 있다(chat:write). 채널을 읽는 권한(channels:history)이 없어서
# 어느 메시지인지는 사람이 슬랙에서 ⋯ → 「링크 복사」로 알려 준다. 다른 사람 메시지 링크를 넣어도 슬랙이 거절한다.
# 첨부 파일은 메시지를 지워도 워크스페이스 파일 목록에 남을 수 있다 — 파일 링크(…/files/…/F…)나 ID 를 같이 주면
# 그것도 지운다(files:write).
#
# Probe 가 쓰는 두 채널(#sat-probe · #ops-partner)의 링크만 받는다.
# 손으로 돌릴 때는 dry_run 이 기본이다 — 링크를 어떻게 읽었는지만 보여 주고 지우지 않는다.
# 이 저장소는 공개라 로그를 누구나 본다 — 채널·시각만 찍고, 메시지 본문은 읽지도 찍지도 않는다.
name: Probe 슬랙 메시지 지우기

on:
  workflow_dispatch:
    inputs:
      link:
        description: "지울 메시지 링크 (슬랙 메시지 ⋯ → 링크 복사)"
        required: true
      file:
        description: "같이 지울 파일 링크나 ID (F…). 비워도 된다"
        required: false
      dry_run:
        description: "지우지 않고 링크를 어떻게 읽었는지만 본다"
        type: boolean
        default: true

jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 지우기
        env:
          SLACK_TOKEN: ${{ secrets.SLACK_PROBE_BOT_TOKEN }}
          # 입력은 env 로만 넘긴다 — run 에 직접 끼우면 링크에 섞인 글자가 셸 명령이 된다
          LINK: ${{ inputs.link }}
          FILE: ${{ inputs.file }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          # 링크 꼴: …/archives/<채널>/p<숫자 16자리>[?thread_ts=…]. 숫자 사이에 점이 섞여 와도 숫자만 모은다
          CH=$(sed -nE 's#.*/archives/([A-Z0-9]+)/p.*#\1#p' <<<"$LINK")
          DIGITS=$(sed -nE 's#.*/archives/[A-Z0-9]+/p([0-9.]+).*#\1#p' <<<"$LINK" | tr -d .)
          [ -n "$CH" ] && [ ${#DIGITS} -eq 16 ] \
            || { echo "::error::메시지 링크를 읽지 못했습니다 — …/archives/<채널>/p<숫자 16자리> 꼴이어야 합니다"; exit 1; }
          case "$CH" in
            C0BPKGXDTPF) NAME="#sat-probe" ;;
            C0BPSQ7F8LC) NAME="#ops-partner" ;;
            *) echo "::error::Probe 채널(#sat-probe · #ops-partner) 링크만 받습니다 — 받은 채널 $CH"; exit 1 ;;
          esac
          TS="${DIGITS:0:10}.${DIGITS:10}"
          echo "메시지: $NAME · $(TZ=Asia/Seoul date -d "@${DIGITS:0:10}" '+%Y-%m-%d %H:%M:%S') KST (ts $TS)"

          FID=""
          if [ -n "$FILE" ]; then
            FID=$(grep -oE '(^|/)F[A-Z0-9]{8,}' <<<"$FILE" | tr -d / | head -1 || true)
            [ -n "$FID" ] || { echo "::error::파일 링크에서 F 로 시작하는 파일 ID 를 찾지 못했습니다"; exit 1; }
            echo "파일: $FID"
          fi

          if [ "$DRY" = "true" ]; then echo "dry_run — 지우지 않고 끝냅니다"; exit 0; fi
          [ -n "$SLACK_TOKEN" ] || { echo "::error::SLACK_PROBE_BOT_TOKEN 이 없습니다"; exit 1; }

          R=$(curl -sS -X POST https://slack.com/api/chat.delete -H "Authorization: Bearer $SLACK_TOKEN" \
            --data-urlencode "channel=$CH" --data-urlencode "ts=$TS")
          if [ "$(jq -r .ok <<<"$R")" = "true" ]; then
            echo "메시지를 지웠습니다"
          else
            # message_not_found = 이미 지웠거나 링크가 틀림 · cant_delete_message = Probe 가 쓴 메시지가 아님
            echo "::error::메시지를 지우지 못했습니다: $(jq -r .error <<<"$R")"; FAILED=1
          fi

          if [ -n "$FID" ]; then
            R=$(curl -sS -X POST https://slack.com/api/files.delete -H "Authorization: Bearer $SLACK_TOKEN" --data-urlencode "file=$FID")
            if [ "$(jq -r .ok <<<"$R")" = "true" ]; then echo "파일을 지웠습니다"
            else echo "::error::파일을 지우지 못했습니다: $(jq -r .error <<<"$R")"; FAILED=1; fi
          fi
          [ -z "${FAILED:-}" ]
