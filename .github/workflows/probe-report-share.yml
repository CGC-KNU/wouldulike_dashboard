# Probe 매장 리포트 → #ops-partner (민찬 0928 · 1002).
#
#   1007: 초안은 게시 14일차에 자동으로 만들어져 probe-report-auto.yml 이 알린다. 담당자는 지표를 입력하고 「승인」 한 번 —
#   그러면 상태가 곧바로 최종 승인(SENT)이라 아래 「최종 승인」 판(PNG 3장 + HTML)만 올라간다.
#   아래 「초안 승인」 판은 예전에 APPROVED 로 남아 있는 리포트를 위해 둔다.
#
#   「승인」(초안 승인)  → 메시지만(파일 없음) — 「초안에 인스타 지표 입력을 진행해 주세요」 + 세틀라이트 리포트 링크 + 인스타 링크
#   「최종 승인」        → PNG 3장 + HTML  — 담당자가 받는 것과 같은 파일, 사장님께 나가는 판
#
#   승인·최종 승인 순간 백엔드가 이 워크플로를 바로 깨운다(백엔드 #101, GITHUB_DISPATCH_TOKEN).
#   10분 정기 실행은 놓친 것을 줍는 용도다 — GitHub 무료 정기 실행은 몇 시간씩 밀린다.
#   백엔드 큐(slack-queue?stages=review,final)가 비어 있으면 바로 끝난다(크롬을 띄우지 않는다).
#   있으면 러너의 크롬으로 대시보드 크론 미리보기를 열어 파일을 만들고(scripts/probe-report-share.mjs),
#   메시지 하나로 올린 뒤 백엔드에 "올림"을 적는다 — 같은 승인·같은 단계는 두 번 안 올린다.
#   문구를 고쳐 다시 승인하면 두 단계 다 「(수정본)」으로 다시 올린다.
#
# **이 저장소는 공개다.** Actions 로그·아티팩트는 누구나 본다 — 로그에는 리포트 id·단계·파일 크기만 남기고,
# 파일을 아티팩트로 올리지 않는다.
#
# 필요한 것 (Settings → Secrets and variables → Actions):
#   BACKEND_BASE_URL · CRON_SECRET_TOKEN · SLACK_PROBE_BOT_TOKEN (Probe 봇이 #ops-partner 에 초대돼 있어야 한다)
name: Probe 매장 리포트 → ops-partner

on:
  schedule:
    - cron: "*/10 0-13 * * *"   # 09:00~22:50 KST
  workflow_dispatch:
    inputs:
      id:
        description: "리포트 id 하나만 (비우면 큐 전체)"
        required: false
      dry_run:
        description: "만들기까지만 하고 슬랙에는 안 올린다"
        type: boolean
        default: true

concurrency:
  group: probe-report-share
  cancel-in-progress: false

jobs:
  share:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DASH: https://app.wouldulike.kr
      BACKEND: ${{ secrets.BACKEND_BASE_URL }}
      CRON_TOKEN: ${{ secrets.CRON_SECRET_TOKEN }}
      SLACK_TOKEN: ${{ secrets.SLACK_PROBE_BOT_TOKEN }}
      CHANNEL: C0BPSQ7F8LC   # #ops-partner
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      ONLY_ID: ${{ inputs.id }}
    steps:
      - name: 큐 확인
        id: queue
        run: |
          set -euo pipefail
          [ -n "$BACKEND" ] && [ -n "$CRON_TOKEN" ] || { echo "::error::BACKEND_BASE_URL · CRON_SECRET_TOKEN 이 없습니다"; exit 1; }
          CODE=$(curl -sS --max-time 30 -o q.json -w '%{http_code}' -H "X-CRON-TOKEN: $CRON_TOKEN" "$BACKEND/api/probe/reports/slack-queue/?stages=review,final") || CODE=000
          [ "$CODE" = "200" ] || { echo "::error::큐 HTTP $CODE"; exit 1; }
          N=$(jq '.reports | length' q.json)
          echo "큐 ${N}건: $(jq -r '[.reports[] | "\(.id)[\(.stage // "-")]"] | join(", ")' q.json)"
          if [ "$N" = "0" ] && [ -z "$ONLY_ID" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

      # 손으로 돌릴 때만 — 승인 순간 이 워크플로를 깨우는 길(백엔드 GITHUB_DISPATCH_TOKEN)이 열려 있는지 한 줄.
      # 값은 안 나온다(종류·길이·상태만). 공개 저장소 로그에 남아도 되는 내용이다.
      - name: 즉시 게시 진단
        if: github.event_name == 'workflow_dispatch'
        run: |
          CODE=$(curl -sS --max-time 30 -o w.json -w '%{http_code}' -H "X-CRON-TOKEN: $CRON_TOKEN" "$BACKEND/api/probe/reports/wake-check/") || CODE=000
          echo "wake-check HTTP $CODE: $(jq -c . w.json 2>/dev/null || head -c 200 w.json)"

      - uses: actions/checkout@v4
        if: steps.queue.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.queue.outputs.run == 'true'
        with:
          node-version: 20

      - name: 크롬 준비 (playwright-core — 러너에 깔린 크롬을 쓴다)
        if: steps.queue.outputs.run == 'true'
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw
          npm init -y > /dev/null
          npm i --no-audit --no-fund playwright-core@1.47.2
          cp "$GITHUB_WORKSPACE/scripts/probe-report-share.mjs" /tmp/pw/

      - name: 만들어 올리기
        if: steps.queue.outputs.run == 'true'
        working-directory: /tmp/pw
        env:
          OUT_DIR: /tmp/pw/out
        run: node probe-report-share.mjs
