<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>사장님께 · 우주라이크 월간 보고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<!--
  ▣ 우주라이크 · 제휴 가게 사장님 월간 보고서 양식 v1.0
  ────────────────────────────────────────────────────────────
  아래 <script type="application/json" id="report-data"> 에 값을 끼우면 그려진다.
  만드는 곳은 src/lib/draft/partnerMonthly.ts, 끼우는 곳은 partnerTemplate.ts.

  받는 사람은 **제휴 가게 사장님 전부**다. 가게별 숫자는 없다(그건 매장 리포트가 맡는다).
  그래서 "사장님 가게가 N번 열렸습니다" 라고 쓰지 않는다.

  값이 없는 칸은 **비운다.** 0 으로 그리지 않는다 — 0 은 "아무 일도 없었다"는 뜻이고,
  못 읽은 것은 "모른다"는 뜻이라 서로 다르다.

  발송 전 검사: 렌더 후 <body data-report-status="ok|error">. error 면 맨 위에 빠진 값이 뜬다.
-->
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --navy:#050072; --peri:#6366E0; --peri2:#A5B0FC; --soft:#EEF0FB; --soft2:#F6F7FF;
    --ink:#111827; --tx:#374151; --sub:#6B7280; --mut:#9CA3AF; --line:#E5E7EB; --line2:#F3F4F6; --bg:#F4F4F9;
    --up:#15803D; --upbg:#F0FDF4;
    color-scheme:light;
  }
  body{background:var(--bg);color:var(--ink);line-height:1.75;font-size:15px;word-break:keep-all;overflow-wrap:break-word;
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    padding:0 16px calc(56px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding-top:calc(28px + env(safe-area-inset-top,0px))}
  .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--peri);background:var(--soft);padding:5px 11px;border-radius:999px}
  h1{font-size:25px;font-weight:800;letter-spacing:-.6px;line-height:1.4;margin:14px 0 8px}
  .sub{font-size:13px;color:var(--sub)}
  .hello{font-size:15px;color:var(--tx);margin:18px 0 24px;line-height:1.85}
  h2{font-size:17px;font-weight:800;letter-spacing:-.4px;margin:36px 0 4px}
  .gd{font-size:13px;color:var(--sub);margin-bottom:12px}
  p{margin:11px 0}
  .card{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:18px 20px;margin:10px 0;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
  .kpi{background:var(--navy);color:#fff;border-radius:14px;padding:16px 14px}
  .kpi .k{font-size:11.5px;color:var(--peri2);margin-bottom:5px;line-height:1.5}
  .kpi .v{font-size:25px;font-weight:800;letter-spacing:-.8px;font-variant-numeric:tabular-nums;line-height:1.2}
  .kpi .v small{font-size:13px;font-weight:600;margin-left:2px;opacity:.85}
  .row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .row .lb{font-size:14.5px;font-weight:700;color:var(--tx)}
  .num{font-size:24px;font-weight:800;letter-spacing:-.7px;font-variant-numeric:tabular-nums;white-space:nowrap}
  .num small{font-size:13px;font-weight:600;color:var(--sub);margin-left:3px}
  .up{display:inline-block;font-size:12px;font-weight:800;color:var(--up);background:var(--upbg);padding:2px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
  .dn{display:inline-block;font-size:12px;font-weight:700;color:var(--sub);background:var(--line2);padding:2px 8px;border-radius:999px;margin-left:6px;white-space:nowrap}
  .d{font-size:12.5px;color:var(--sub);margin-top:6px;line-height:1.8}
  .none{font-size:13px;color:var(--mut)}
  .foot{margin-top:44px;padding-top:18px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut);line-height:1.9}
  #err{display:none;background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;border-radius:12px;padding:14px 16px;margin:14px 0;font-size:13px}
  body[data-report-status="error"] #err{display:block}
  @media (max-width:520px){ .kpis{grid-template-columns:1fr} .num{font-size:21px} }
</style>
</head>
<body data-report-status="ok">
<div class="wrap">
  <div id="err"></div>
  <div id="p-head"></div>
  <div id="p-kpi"></div>
  <div id="p-groups"></div>
  <div id="p-close"></div>
  <div id="p-foot"></div>
</div>

<script type="application/json" id="report-data">
{
  "report": { "type": "partner_monthly", "label": "2026년 9월", "period": "2026-09",
              "range": { "start": "2026-09-01", "end": "2026-09-30" }, "generated_at": "2026-10-01", "through": null },
  "headline": ["ig_reach", "store_opens_per_day", "coupons_used"],
  "groups": [],
  "app": null,
  "instagram": null
}
</script>

<script>
(function () {
  var D = {};
  var MISSING = [];
  try { D = JSON.parse(document.getElementById("report-data").textContent || "{}"); }
  catch (e) { MISSING.push("report-data 를 읽지 못했습니다"); }

  var has = function (v) { return v !== null && v !== undefined && v !== ""; };
  var esc = function (s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  };
  var n = function (v) { return has(v) ? Number(v).toLocaleString("ko-KR") : "—"; };
  var put = function (id, html) { var el = document.getElementById(id); if (el) el.innerHTML = html; };
  var need = function (v, name) { if (!has(v)) MISSING.push(name); };

  var R = D.report || {};
  need(R.label, "report.label");
  need(R.generated_at, "report.generated_at");

  var cards = [];
  (D.groups || []).forEach(function (g) { (g.cards || []).forEach(function (c) { cards.push(c); }); });
  var byKey = {};
  cards.forEach(function (c) { byKey[c.key] = c; });

  // 전달 대비 — 늘었으면 초록, 줄었으면 회색(빨강을 쓰지 않는다: 사장님께 약점을 말하지 않는다)
  var chip = function (c) {
    if (!has(c.change)) return "";
    var up = c.change > 0;
    return '<span class="' + (up ? "up" : "dn") + '">' + (up ? "▲ " : "▼ ") + Math.abs(c.change) + "%</span>";
  };

  // ── 머리말 ──
  var range = R.range && has(R.range.start) ? esc(R.range.start) + " ~ " + esc(R.range.end) : "";
  put("p-head",
    '<span class="chip">우주라이크 · 제휴 가게 월간 보고</span>' +
    "<h1>" + esc(R.label) + ", 가게가<br>얼마나 알려졌는지 전해드립니다</h1>" +
    '<p class="sub">' + range + "</p>" +
    '<p class="hello">안녕하세요, 사장님. 우주라이크입니다.<br>' +
    "지난 한 달 동안 우주라이크 인스타그램과 앱에서 어떤 일이 있었는지 정리해 드립니다. " +
    "가게마다 따로 드리는 리포트와 달리, 이 보고서는 <b>우주라이크 전체의 기록</b>입니다.</p>");

  // ── 머리 숫자 셋 ──
  var picked = (D.headline || []).map(function (k) { return byKey[k]; })
    .filter(function (c) { return c && has(c.value); });
  put("p-kpi", picked.length
    ? '<div class="kpis">' + picked.map(function (c) {
        return '<div class="kpi"><p class="k">' + esc(c.label) + '</p><p class="v">' + n(c.value) +
          "<small>" + esc(c.unit) + "</small></p></div>";
      }).join("") + "</div>"
    : "");

  // ── 묶음 ──
  put("p-groups", (D.groups || []).map(function (g) {
    var rows = (g.cards || []).map(function (c) {
      var right = has(c.value)
        ? '<p class="num">' + n(c.value) + "<small>" + esc(c.unit) + "</small>" + chip(c) + "</p>"
        : '<p class="none">이번 달은 세지 못했습니다</p>';
      return '<div class="card"><div class="row"><span class="lb">' + esc(c.label) + "</span>" + right +
        '</div><p class="d">' + esc(c.note) + "</p></div>";
    }).join("");
    return "<h2>" + esc(g.title) + '</h2><p class="gd">' + esc(g.description) + "</p>" + rows;
  }).join(""));

  // ── 맺음말 ──
  var A = D.app || {}, IG = D.instagram || {};
  var bits = [];
  if (has(IG.posts)) bits.push("이번 달 우주라이크 인스타그램에 <b>" + n(IG.posts) + "건</b>의 게시물을 올렸습니다.");
  if (has(A.stores_seen)) bits.push("앱에서는 제휴 가게 <b>" + n(A.stores_seen) + "곳</b>이 한 번 이상 열렸습니다.");
  if (has(A.active_devices)) bits.push("앱을 켠 학생은 <b>" + n(A.active_devices) + "명</b>입니다.");
  put("p-close",
    "<h2>다음 달에도</h2>" +
    (bits.length ? "<p>" + bits.join(" ") + "</p>" : "") +
    "<p>사장님 가게의 숫자는 <b>가게별 리포트</b>로 따로 보내 드립니다. " +
    "메뉴나 사진이 바뀌었거나, 앱에서 불편하셨던 점이 있으면 언제든 편하게 말씀해 주세요.</p>");

  // ── 각주 ──
  var notes = [];
  if (has(R.range && R.range.start)) notes.push(esc(R.range.start) + " ~ " + esc(R.range.end) + " 기록입니다. " + esc(R.generated_at) + " 에 정리했습니다.");
  if (has(R.through)) notes.push("앱 숫자는 " + esc(R.through) + " 까지만 집계돼 달 전체가 아닙니다.");
  notes.push("앱 숫자는 <b>사람이 아니라 기기</b>를 셉니다. 같은 분이 앱을 지웠다 깔면 새로 셉니다.");
  notes.push("인스타그램 숫자는 메타에서 받은 값이고, 가게가 소개된 게시물 전체의 합입니다.");
  notes.push("달마다 날짜 수가 달라, 가게 소개 화면은 <b>하루 평균</b>으로 적었습니다.");
  put("p-foot", '<div class="foot">' + notes.join("<br>") + "<br>우주라이크</div>");

  if (MISSING.length) {
    document.body.setAttribute("data-report-status", "error");
    put("err", "<b>빠진 값이 있어 그대로 보내면 안 됩니다</b><br>" + MISSING.map(esc).join("<br>"));
  }
})();
</script>
</body>
</html>
